services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: celldb
      POSTGRES_PASSWORD: mysuperstrongpassword
      POSTGRES_DB: cell_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cell_network

  minio:
    image: alpine/minio:latest-release
    container_name: minio_s3
    user: "0:0"
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - cell_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cell_backend
    restart: always
    depends_on:
      - postgres
      - minio
    environment:
      - DB_URL=postgres://celldb:mysuperstrongpassword@postgres:5432/cell_db?sslmode=disable
      - PORT=8080
      - SECRET_KEY=super-secret-key123
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=cell-media
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=miniopassword123
      - S3_PUBLIC_URL=http://localhost:9000/cell-media
    networks:
      - cell_network

  calls:
    build:
      context: ./CallsService
      dockerfile: Dockerfile
    container_name: cell_calls
    restart: always
    depends_on:
      - postgres
      - api
    environment:
      - PORT=8000
      - DB_URL=postgres://celldb:mysuperstrongpassword@postgres:5432/cell_db?sslmode=disable
      - SECRET_KEY=super-secret-key123
      - STUN_SERVER=stun:stun.l.google.com:19302
      - NAT_1TO1_IP=
      - UDP_MIN_PORT=50000
      - UDP_MAX_PORT=50050
    ports:
      - "8000:8000"
      - "50000-50050:50000-50050/udp"
    networks:
      - cell_network

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - api
      - calls
      - minio
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cell_network

volumes:
  pgdata:
  minio_data:

networks:
  cell_network:
    driver: bridge