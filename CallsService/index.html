<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Cell Calls - WebRTC SFU</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h2 {
      margin-top: 0;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-service {
      font-size: 12px;
      background: #2563eb;
      color: #fff;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .control-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 768px) {
      .input-grid { grid-template-columns: 1fr; }
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }
    input, select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    #startBtn { background: #2563eb; color: #fff; }
    #startBtn:hover:not(:disabled) { background: #1d4ed8; }
    #hangupBtn { background: #ef4444; color: #fff; }
    #hangupBtn:hover:not(:disabled) { background: #dc2626; }
    #toggleMicBtn { background: #334155; color: #f8fafc; }
    #toggleCamBtn { background: #334155; color: #f8fafc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    #ping { color: #4ade80; font-weight: bold; }
    #status { color: #38bdf8; font-weight: 500; }

    .participants-bar {
      margin-top: 12px;
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .user-pill {
      background: #334155;
      color: #e2e8f0;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
      width: 100%;
    }
    .video-card {
      position: relative;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #090d16;
    }
    .video-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }
    .error-box {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>
      Cell Calls WebRTC Service
      <span class="badge-service">SFU Autonomous</span>
    </h2>

    <div class="control-card">
      <div class="input-grid">
        <div class="field-group">
          <label for="tokenInput">JWT Токен авторизации (Bearer)</label>
          <input id="tokenInput" type="text" placeholder="Вставьте токен полученный при логине (из localStorage cell_token)">
        </div>
        <div class="field-group">
          <label for="chatIdInput">ID чата (UUID)</label>
          <input id="chatIdInput" type="text" placeholder="UUID чата, в котором разрешен звонок">
        </div>
      </div>

      <div class="top-bar">
        <button id="startBtn">📞 Подключиться к звонку</button>
        <button id="hangupBtn" disabled>❌ Завершить</button>
        <button id="toggleMicBtn" disabled>🎤 Выкл. микрофон</button>
        <button id="toggleCamBtn" disabled>📷 Выкл. камеру</button>
        <span class="stats-badge">Статус: <span id="status">Отключено</span></span>
        <span class="stats-badge">Пинг: <span id="ping">—</span> мс</span>
      </div>

      <div class="error-box" id="errorBox"></div>

      <div class="participants-bar" id="participantsBar" style="display: none;">
        <span>В звонке:</span>
        <div id="participantsList" style="display: inline-flex; gap: 6px; flex-wrap: wrap;"></div>
      </div>
    </div>

    <div class="video-grid" id="videoGrid">
      <div class="video-card" id="localCard">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-label" id="localLabel">Вы (Локально)</div>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const statusText = document.getElementById('status');
    const pingText = document.getElementById('ping');
    const videoGrid = document.getElementById('videoGrid');
    const localVideo = document.getElementById('localVideo');
    const tokenInput = document.getElementById('tokenInput');
    const chatIdInput = document.getElementById('chatIdInput');
    const errorBox = document.getElementById('errorBox');
    const participantsBar = document.getElementById('participantsBar');
    const participantsList = document.getElementById('participantsList');
    const localLabel = document.getElementById('localLabel');

    // Auto-fill from localStorage or URL search params
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('token')) tokenInput.value = urlParams.get('token');
    else if (localStorage.getItem('cell_token')) tokenInput.value = localStorage.getItem('cell_token');

    if (urlParams.get('chat_id')) chatIdInput.value = urlParams.get('chat_id');

    let pc = null;
    let ws = null;
    let localStream = null;
    let pingInterval = null;
    let micEnabled = true;
    let camEnabled = true;
    const candidateQueue = [];
    const participants = new Map();

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    function clearError() {
      errorBox.innerText = '';
      errorBox.style.display = 'none';
    }

    function updateParticipantsUI() {
      participantsList.innerHTML = '';
      if (participants.size === 0) {
        participantsBar.style.display = 'none';
        return;
      }
      participantsBar.style.display = 'flex';
      participants.forEach((user) => {
        const span = document.createElement('span');
        span.className = 'user-pill';
        span.innerText = `${user.username || 'Участник'} (${user.peer_id.substring(0, 6)})`;
        participantsList.appendChild(span);
      });
    }

    startBtn.onclick = async () => {
      clearError();
      const token = tokenInput.value.trim();
      const chatId = chatIdInput.value.trim();

      if (!token) {
        showError('Пожалуйста, укажите JWT токен авторизации');
        return;
      }
      if (!chatId) {
        showError('Пожалуйста, укажите Chat ID для входа в комнату');
        return;
      }

      startBtn.disabled = true;
      statusText.innerText = 'Запрос камеры и звука...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 24 }
          }
        });

        localVideo.srcObject = localStream;

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // Connect through /api/v1/calls/ws or fallback to /ws
        const wsHost = window.location.host;
        const wsPath = window.location.pathname.startsWith('/calls') || window.location.pathname.startsWith('/api') 
          ? '/api/v1/calls/ws' 
          : '/ws';

        const wsUrl = `${protocol}//${wsHost}${wsPath}?token=${encodeURIComponent(token)}&chat_id=${encodeURIComponent(chatId)}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = async () => {
          statusText.innerText = 'Подключение к SFU...';
          await setupPeerConnection();
          startPingMonitoring();
          toggleMicBtn.disabled = false;
          toggleCamBtn.disabled = false;
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === 'room-info') {
            statusText.innerText = 'В эфире';
            hangupBtn.disabled = false;
            localLabel.innerText = `Вы (${msg.peer_id.substring(0, 6)})`;
            if (msg.participants) {
              msg.participants.forEach(p => participants.set(p.peer_id, p));
              updateParticipantsUI();
            }
          } else if (msg.type === 'user-joined') {
            participants.set(msg.peer_id, msg);
            updateParticipantsUI();
          } else if (msg.type === 'offer') {
            if (pc.signalingState !== 'stable') {
              await Promise.all([
                pc.setLocalDescription({ type: 'rollback' }).catch(() => {}),
                pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }))
              ]);
            } else {
              await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }));
            }

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
              type: 'answer',
              sdp: answer.sdp
            }));

            drainCandidates();

          } else if (msg.type === 'answer') {
            if (pc.signalingState !== 'have-local-offer') {
              console.warn('Пропущен answer. Текущий signalingState:', pc.signalingState);
              return;
            }

            await pc.setRemoteDescription(new RTCSessionDescription({
              type: 'answer',
              sdp: msg.sdp
            }));

            drainCandidates();
            statusText.innerText = 'В эфире';
            hangupBtn.disabled = false;

          } else if (msg.type === 'candidate') {
            const cand = new RTCIceCandidate(msg.candidate);
            if (!pc.remoteDescription) {
              candidateQueue.push(cand);
            } else {
              try {
                await pc.addIceCandidate(cand);
              } catch (e) {
                console.warn('Ошибка применения ICE-кандидата:', e);
              }
            }

          } else if (msg.type === 'user-left') {
            participants.delete(msg.peer_id);
            updateParticipantsUI();
            const card = document.getElementById(`card-${msg.id}`);
            if (card) {
              card.remove();
            }
          } else if (msg.type === 'call-ended') {
            statusText.innerText = 'Звонок завершен сервером';
            hangupBtn.click();
          }
        };

        ws.onerror = (err) => {
          console.error('Ошибка сокета:', err);
          showError('Ошибка соединения с сервером звонков (проверьте токен и доступ к чату)');
          statusText.innerText = 'Ошибка сокета';
          startBtn.disabled = false;
        };

        ws.onclose = (event) => {
          if (event.code === 401 || event.code === 403) {
            showError(`Доступ запрещен (код ${event.code}): пользователь не авторизован или не состоит в этом чате`);
          }
          if (pc) cleanup();
        };

      } catch (err) {
        console.error(err);
        showError('Ошибка доступа к медиа-устройствам (микрофон/камера): ' + err.message);
        statusText.innerText = 'Ошибка доступа';
        startBtn.disabled = false;
      }
    };

    async function drainCandidates() {
      while (candidateQueue.length > 0) {
        const cand = candidateQueue.shift();
        try {
          await pc.addIceCandidate(cand);
        } catch (e) {
          console.warn('Ошибка применения кандидата:', e);
        }
      }
    }

    async function setupPeerConnection() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = (event) => {
        const stream = event.streams[0];
        if (!stream) return;

        if (localStream && stream.id === localStream.id) {
          return;
        }

        let card = document.getElementById(`card-${stream.id}`);
        if (!card) {
          card = document.createElement('div');
          card.className = 'video-card';
          card.id = `card-${stream.id}`;

          const video = document.createElement('video');
          video.autoplay = true;
          video.playsInline = true;
          video.srcObject = stream;

          const label = document.createElement('div');
          label.className = 'video-label';
          const pInfo = Array.from(participants.values()).find(p => p.stream_id === stream.id);
          label.innerText = pInfo ? `${pInfo.username || 'Участник'}` : `Стрим #${stream.id.replace('stream-', '').substring(0, 6)}`;

          card.appendChild(video);
          card.appendChild(label);
          videoGrid.appendChild(card);
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'candidate',
            candidate: event.candidate
          }));
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      ws.send(JSON.stringify({
        type: 'offer',
        sdp: offer.sdp
      }));
    }

    function startPingMonitoring() {
      pingInterval = setInterval(async () => {
        if (!pc) return;
        try {
          const stats = await pc.getStats();
          stats.forEach(report => {
            if (
              report.type === 'candidate-pair' &&
              report.state === 'succeeded' &&
              report.currentRoundTripTime !== undefined
            ) {
              pingText.innerText = Math.round(report.currentRoundTripTime * 1000);
            }
          });
        } catch (e) {}
      }, 1000);
    }

    toggleMicBtn.onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        micEnabled = !micEnabled;
        audioTrack.enabled = micEnabled;
        toggleMicBtn.innerText = micEnabled ? '🎤 Выкл. микрофон' : '🔇 Вкл. микрофон';
      }
    };

    toggleCamBtn.onclick = () => {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        camEnabled = !camEnabled;
        videoTrack.enabled = camEnabled;
        toggleCamBtn.innerText = camEnabled ? '📷 Выкл. камеру' : '🚫 Вкл. камеру';
      }
    };

    function cleanup() {
      clearInterval(pingInterval);
      if (pc) {
        pc.close();
        pc = null;
      }
      if (ws) {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'leave' }));
        }
        ws.close();
        ws = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      const remoteCards = document.querySelectorAll('.video-card:not(#localCard)');
      remoteCards.forEach(c => c.remove());

      localVideo.srcObject = null;
      startBtn.disabled = false;
      hangupBtn.disabled = true;
      toggleMicBtn.disabled = true;
      toggleCamBtn.disabled = true;
      pingText.innerText = '—';
      statusText.innerText = 'Отключено';
      participants.clear();
      updateParticipantsUI();
    }

    hangupBtn.onclick = cleanup;
  </script>
</body>
</html>
